name: Android CI

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build with Gradle
      run: ./gradlew assembleDebug --stacktrace 2>&1 | tee build_output.log
      continue-on-error: true

    - name: Upload build log
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: build-log
        path: build_output.log

    - name: Upload APK
      if: success()
      uses: actions/upload-artifact@v7
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk

    - name: Create GitHub Release for Auto-Update
      if: success()
      uses: softprops/action-gh-release@v1
      with:
        tag_name: v1.${{ github.run_number }}
        name: NexaFlow Update v1.${{ github.run_number }}
        body: "Auto-generated update"
        files: app/build/outputs/apk/debug/app-debug.apk

    - name: Check build result
      run: |
        if grep -q "BUILD SUCCESSFUL" build_output.log; then
          echo "Build succeeded!"
        else
          echo "Build failed! Check build-log artifact for details."
          grep -A2 "^e:" build_output.log || true
          exit 1
        fi
